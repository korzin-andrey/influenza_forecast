[tool.poetry]
name = "influenza-forecast"

version = "1.0.0"

description = "A project represents a framework for influenza modeling using Baroyan-Rvachev model with simulated annealing and L-BFGS-B optimization techniques. Uncertainty quantification is also enabled."

authors = ["..."]

readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
dash = "^2.18.1"
dash-bootstrap-components = "^1.6.0"
dash-extensions = "^1.0.18"
diskcache = "^5.6.3"
psutil = "^6.0.0"
multiprocess = "^0.70.17"
pyyaml = "^6.0.2"
matplotlib = "^3.9.2"
scipy = "^1.14.1"
simanneal = "^0.5.0"
jsonpickle = "^3.3.0"
joblib = "^1.4.2"
pathos = "^0.3.3"
scikit-learn = "^1.5.2"
xlsxwriter = "^3.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
